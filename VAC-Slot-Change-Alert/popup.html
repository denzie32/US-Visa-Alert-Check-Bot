<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VAC Slot Alert</title>
    <style>
      body { width: 290px; margin: 0; padding: 16px; color: #1f2937; font: 14px Arial, sans-serif; }
      h1 { margin: 0 0 10px; font-size: 17px; }
      p { line-height: 1.4; }
      button { width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 5px; color: white; background: #d94f16; font-weight: 700; cursor: pointer; }
      button.secondary { color: #1f2937; background: #e5e7eb; }
      #status { min-height: 36px; }
      .note { color: #5b6472; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>H-1B VAC Slot Alert</h1>
    <p id="status">Checking monitor status…</p>
    <button id="start">Start / reset baseline</button>
    <button id="stop" class="secondary">Stop monitoring</button>
    <p class="note">Keeps checking the open page every 3 minutes while this browser is running and the computer is awake. Plays a sound when new VAC availability is detected (up to 3 minutes plus page-load time). A 403 or unreadable table stops monitoring.</p>
    <script src="popup.js"></script>
  </body>
</html>
