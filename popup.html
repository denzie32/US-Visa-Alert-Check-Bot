<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VAC Slot Alert</title>
    <style>
      body { box-sizing: border-box; width: 330px; margin: 0; padding: 16px; color: #1f2937; font: 14px Arial, sans-serif; }
      h1 { margin: 0 0 10px; font-size: 17px; }
      h2 { margin: 16px 0 8px; font-size: 14px; }
      p { line-height: 1.4; }
      button { width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 5px; color: white; background: #d94f16; font-weight: 700; cursor: pointer; }
      button.secondary { color: #1f2937; background: #e5e7eb; }
      #status { min-height: 36px; }
      .note { color: #5b6472; font-size: 12px; }
      .history-list { max-height: 230px; margin: 0; padding: 0; overflow-y: auto; list-style: none; }
      .history-list li { padding: 8px 0; border-top: 1px solid #e5e7eb; }
      .history-list time { color: #5b6472; font-size: 11px; }
      .history-detail { margin: 4px 0 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>H-1B VAC Slot Alert</h1>
    <p id="status">Checking monitor status…</p>
    <button id="start">Start / reset baseline</button>
    <button id="stop" class="secondary">Stop monitoring</button>
    <h2>Availability history</h2>
    <ol id="history" class="history-list" aria-live="polite"><li class="note">Loading history…</li></ol>
    <p class="note">Live page changes are checked immediately; the page reloads every 3 minutes as a fallback. Keep the browser open and the computer awake.</p>
    <script src="popup.js"></script>
  </body>
</html>
